name: innerwave_studio
description: A local multitrack stereo audio studio for iPhone and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_session: 0.2.2
  file_picker: 10.3.10
  just_audio: 0.10.5
  path_provider: 2.1.5
  record: 6.1.2
  share_plus: 11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
