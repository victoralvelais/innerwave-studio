name: innerwave_studio
description: A local multitrack stereo audio studio for iPhone and Android.
publish_to: none
version: 0.3.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_session: 0.2.2
  ffmpeg_kit_flutter_new_audio: 2.5.8
  file_picker: 10.3.10
  path_provider: 2.1.5
  # Keep the platform-plugin implementations while the native-assets compiler
  # cannot quote this Windows workspace's SDK path during flutter test.
  path_provider_android: 2.2.23
  path_provider_foundation: 2.5.1
  record: 6.1.2
  share_plus: 11.1.0
  url_launcher: ^6.3.3
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
