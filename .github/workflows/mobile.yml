name: Mobile prototype
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: android }
          - { os: macos-26, target: ios }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Flutter 3.47.9
        run: |
          git clone --quiet --branch 3.47.9 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - if: matrix.target == 'android'
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --release
          mkdir -p build/delivery
          cp build/app/outputs/flutter-apk/app-release.apk build/delivery/Innerwave-Studio.apk
      - if: matrix.target == 'ios'
        name: Build unsigned iPhone app
        run: |
          flutter build ios --release --no-codesign --no-pub
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          ditto -c -k --keepParent Payload Innerwave-Studio-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Innerwave-Studio-${{ matrix.target }}
          path: |
            build/delivery/Innerwave-Studio.apk
            build/ipa/Innerwave-Studio-unsigned.ipa
          if-no-files-found: error
      - if: matrix.target == 'ios'
        name: Test recording, mixing and codecs on an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(x["udid"] for k,v in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b > "$RUNNER_TEMP/boot.log" &
          boot_pid=$!
          flutter build ios --simulator --debug --no-pub
          wait "$boot_pid"
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$device" grant microphone studio.innerwave.innerwaveStudio
          flutter test --no-pub integration_test/overdub_test.dart -d "$device"
      - if: matrix.target == 'android'
        name: Test recording, mixing and codecs on an Android emulator
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -x "$sdkmanager_path"
          export PATH="$(dirname "$sdkmanager_path"):$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-35;default;x86_64'
          sdkmanager "$image" emulator
          echo no | avdmanager create avd -n studio --package "$image" --force
          "$ANDROID_HOME/emulator/emulator" -avd studio -port 5554 -no-window -no-snapshot -no-boot-anim -no-audio -gpu swiftshader -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 120 adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb install -g build/delivery/Innerwave-Studio.apk
          flutter test integration_test/overdub_test.dart -d emulator-5554
