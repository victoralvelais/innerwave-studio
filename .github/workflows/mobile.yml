name: Mobile prototype
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: innerwave-main-releases
  queue: max

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      build: ${{ steps.reserve.outputs.build }}
      published: ${{ steps.reserve.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - name: Reserve semantic version and mobile build number
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/mobile_release.py reserve

  build:
    needs: version
    if: needs.version.outputs.published == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: android }
          - { os: macos-26, target: ios }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      APK_PATH: build/delivery/Innerwave-Studio-v${{ needs.version.outputs.version }}.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Flutter 3.47.9
        run: |
          git clone --quiet --branch 3.47.9 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - if: matrix.target == 'android'
        name: Analyze and test the editor
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - if: matrix.target == 'android'
        name: Sign and verify versioned Android APK
        env:
          INNERWAVE_ANDROID_KEYSTORE: ${{ secrets.INNERWAVE_ANDROID_KEYSTORE }}
          INNERWAVE_ANDROID_KEY_PASSWORD: ${{ secrets.INNERWAVE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$INNERWAVE_ANDROID_KEYSTORE" && test -n "$INNERWAVE_ANDROID_KEY_PASSWORD" || { echo "::error::Android release signing secrets are missing."; exit 1; }
          umask 077
          export INNERWAVE_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/innerwave-release.p12"
          trap 'rm -f "$INNERWAVE_ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$INNERWAVE_ANDROID_KEYSTORE" | base64 --decode > "$INNERWAVE_ANDROID_KEYSTORE_PATH"
          unset INNERWAVE_ANDROID_KEYSTORE
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD"
          mkdir -p build/delivery
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_PATH"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$build_tools/aapt" dump badging "$APK_PATH" > "$RUNNER_TEMP/apk-badging"
          grep -F "package: name='studio.innerwave.innerwave_studio'" "$RUNNER_TEMP/apk-badging" | grep -F "versionCode='$BUILD'" | grep -F "versionName='$VERSION'"
          "$build_tools/apksigner" verify --print-certs "$APK_PATH" > "$RUNNER_TEMP/apk-signer"
          certificate=$(keytool -exportcert -alias innerwave -keystore "$INNERWAVE_ANDROID_KEYSTORE_PATH" -storepass:env INNERWAVE_ANDROID_KEY_PASSWORD | sha256sum | cut -d' ' -f1)
          grep -Fxi "Signer #1 certificate SHA-256 digest: $certificate" "$RUNNER_TEMP/apk-signer"
      - if: matrix.target == 'android'
        name: Test recording, mixing and codecs on an Android emulator
        run: bash .github/scripts/check_android.sh
      - if: matrix.target == 'ios'
        name: Build and verify unsigned iPhone IPA
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --no-pub --build-name="$VERSION" --build-number="$BUILD"
          app=build/ios/iphoneos/Runner.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$app/Info.plist")" = iphoneos
          xcrun lipo "$app/Runner" -verify_arch arm64
          mkdir -p build/ipa/Payload build/delivery
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && ditto -c -k --keepParent Payload "../delivery/Innerwave-Studio-v$VERSION.ipa")
      - if: matrix.target == 'ios'
        name: Test recording, mixing and codecs on an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(x["udid"] for k,v in json.load(sys.stdin)["devices"].items() if ".iOS-" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$device" -b > "$RUNNER_TEMP/boot.log" &
          boot_pid=$!
          flutter build ios --simulator --debug --no-pub
          wait "$boot_pid"
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$device" grant microphone studio.innerwave.innerwaveStudio
          flutter test --no-pub integration_test/overdub_test.dart -d "$device"
      - uses: actions/upload-artifact@v4
        with:
          name: Innerwave-Studio-v${{ env.VERSION }}-${{ matrix.target }}
          path: build/delivery/Innerwave-Studio-v${{ env.VERSION }}.*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Innerwave-Studio-v${{ needs.version.outputs.version }}-*
          path: build/delivery
          merge-multiple: true
      - name: Verify digests and publish the pair
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: python3 -B .github/scripts/mobile_release.py publish build/delivery
